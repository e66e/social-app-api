services:
  postgres:
    image: 'postgres:18.4'
    environment:
      - 'POSTGRES_DB=social_app_db'
      - 'POSTGRES_PASSWORD=secret' # confidential
      - 'POSTGRES_USER=admin' # confidential
    ports:
      - '5432:5432'
    volumes:
      - ./init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d social_app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.7.1'
    environment:
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin' # confidential
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin' # confidential
      - 'KC_DB=postgres'
      - 'KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db'
      - 'KC_DB_USERNAME=kc_user' # confidential
      - 'KC_DB_PASSWORD=kc_secret' # confidential
    ports:
      - '8090:8080'
    volumes:
      - ./social-app-realm.json:/opt/keycloak/data/import/social-app-realm.json
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy